[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pollex"
version = "0.1.0"
description = "Vision-Language-Action pipeline for robotic manipulation via hand tracking"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "h5py>=3.8.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "einops>=0.7.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "huggingface-hub>=0.20.0",
    "safetensors>=0.4.0",
    "imageio>=2.30.0",
    "imageio-ffmpeg>=0.4.0",
    "robosuite>=1.4.0",
    "mujoco>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "tensorboard>=2.14.0",
    "wandb>=0.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
